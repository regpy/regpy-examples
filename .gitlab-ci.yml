stages:
  - sync

sync_to_github:
  stage: sync
  image: alpine:latest
  before_script:
    # Install SSH and Git
    - apk add --no-cache git openssh

    # Setup SSH directory
    - mkdir -p ~/.ssh
    - echo "$GITHUB_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    # Disable strict host key checking (or add GitHub’s fingerprint explicitly)
    - echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

    # Git identity
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@example.com"

    # Add GitHub as a remote
    - git remote add github git@github.com:ORG/REPO.git

  script:
    - git fetch --all
    - git push github HEAD:main   # push current branch to GitHub main
  when: manual